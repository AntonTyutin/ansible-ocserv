---
# WAN-facing interface name for UFW route rules (traffic from vpns* -> external).
# Override in inventory if auto-detection is wrong.
external_interface_ipv4: "{{ ansible_default_ipv4.interface | default('eth0') }}"

ocserv_build_src_dir: /usr/local/src/ocserv

ocserv_users: []
  # - name: user
  #   password: !vault |
  #         $ANSIBLE_VAULT;1.1;AES256
  #         ...
  #   ipv4_address: 10.100.10.5   # optional
  #   routes:                     # optional, per-user system routes
  #     - 192.168.50.0/24
  #     - 10.20.0.0/16

ocserv_passwd_file: /etc/ocserv/ocserv.passwd
ocserv_per_user_config_dir: /etc/ocserv/config-per-user/
ocserv_user_routes_dir: /etc/ocserv/user-routes/
ocserv_connect_script: /usr/libexec/ocserv-user-routes-hook.sh
ocserv_has_user_routes: "{{ ocserv_users | selectattr('routes', 'defined') | selectattr('routes') | list | length > 0 }}"
ocserv_default_domain: vpn.example.com
# Path on the Ansible controller to a CA certificate file to install for client cert auth (optional).
ocserv_ca_cert_file: ""
# Optional secondary methods (e.g. certificate). Leave empty unless you install `ocserv_ca_cert_file` and need client certs.
ocserv_enable_auth: []

# Main ocserv configuration
ocserv_config:
  # Authentication
  auth: # list of auth methods, all must succeed
    - type: plain # pam, plain, certificate, radius
      options:
        passwd: "{{ ocserv_passwd_file }}"
  enable_auth: "{{ ocserv_enable_auth }}"

  # Network settings
  listen_host: 127.0.0.1
  tcp_port: 1443
  udp_port: 1443
  listen_proxy_proto: true

  # Server settings for Ubuntu
  run_as_user: nobody
  run_as_group: daemon
  server_cert: /etc/ocserv/fullchain.pem
  server_key: /etc/ocserv/key.pem
  ca_cert: /etc/ocserv/ca-cert.pem

  # Security and performance
  isolate_workers: true
  max_clients: 20
  max_same_clients: 5
  keepalive: 1200
  dpd: 60
  mobile_dpd: 300
  switch_to_tcp_timeout: 25
  try_mtu_discovery: true
  # Disabled by default (compression can weaken TLS for some threat models); enable only if you need it for bandwidth.
  compression: false
  no_compress_limit: 256
  tls_priorities: "NORMAL:%SERVER_PRECEDENCE:%COMPAT:-RSA:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1:-ARCFOUR-128"

  # Timeouts
  auth_timeout: 240
  idle_timeout: 1200
  mobile_idle_timeout: 1800
  min_reauth_time: 300
  max_ban_score: 80
  ban_reset_time: 300
  cookie_timeout: 1200
  # Bind session cookies to the client IP (reduces stolen-cookie reuse from another network).
  deny_roaming: true
  rekey_time: 172800
  rekey_method: ssl

  # Network configuration
  device: vpns
  predictable_ips: true
  default_domain: "{{ ocserv_default_domain }}"
  ipv4_network: 10.100.10.0
  ipv4_netmask: 255.255.255.0
  tunnel_all_dns: true
  ping_leases: false

  # DNS servers
  dns:
    - 8.8.8.8
    - 1.1.1.1

  # Routes
  route: [] # use as default route
    # - 10.10.10.0/255.255.255.0
    # - 192.168.0.0/255.255.255.0

  # No routes
  no_route: []
    # - 192.168.5.0/255.255.255.0

  # User configuration
  config_per_user: "{{ ocserv_per_user_config_dir }}"
  connect_script: "{{ ocserv_connect_script if ocserv_has_user_routes else '' }}"
  disconnect_script: "{{ ocserv_connect_script if ocserv_has_user_routes else '' }}"

  # Stricter defaults; set true only if you must support legacy AnyConnect / old OpenConnect clients.
  cisco_client_compat: false
  dtls_legacy: false

  # Other settings
  use_occtl: true
  pid_file: /run/ocserv.pid
  socket_file: /run/ocserv.socket
  config_file: /etc/ocserv/ocserv.conf
