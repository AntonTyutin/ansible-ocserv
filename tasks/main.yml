---
- name: Get latest ocserv release info
  uri:
    url: "https://gitlab.com/api/v4/projects/openconnect%2Focserv/releases?order_by=released_at&sort=desc&per_page=1"
    return_content: yes
    validate_certs: true
    timeout: 30
  register: ocserv_releases
  retries: 3
  delay: 5
  until: ocserv_releases.status | default(0) == 200
  failed_when: (ocserv_releases.status | default(0) != 200) or (ocserv_releases.json | default([]) | length == 0)

- name: Set latest ocserv version and tarball url
  set_fact:
    ocserv_latest_version: "{{ ocserv_releases.json[0].tag_name | regex_replace('^v', '') }}"
    ocserv_tarball_url: "{{ ocserv_releases.json[0].assets.sources | selectattr('format', 'equalto', 'tar.gz') | map(attribute='url') | list | first }}"

- name: Require a tar.gz source URL from GitLab release metadata
  assert:
    that:
      - ocserv_tarball_url is defined
      - (ocserv_tarball_url | string | length) > 0
      - ocserv_tarball_url is match('^https://')
    fail_msg: >-
      GitLab API did not return an https tar.gz source URL for ocserv (check API response / asset list).

- name: Get installed ocserv version
  command: ocserv --version
  register: ocserv_installed_version
  failed_when: false
  changed_when: false

- name: Parse installed ocserv version
  set_fact:
    ocserv_installed_version: "{{ (ocserv_installed_version.stderr | regex_search('OpenConnect VPN Server ([0-9.]+)', '\\1') | list | first) if ocserv_installed_version.rc == 0 else '0.0.0' }}"

- name: Set build_needed fact when version comparison needed
  set_fact:
    ocserv_build_needed: "{{ ocserv_latest_version | string is version(ocserv_installed_version | string, '>', strict=False) }}"

- name: Validate ocserv account names
  assert:
    that:
      - item is match('^[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: >-
      ocserv username must be a POSIX-like login name ({{ item }} is not allowed).
  loop: "{{ ocserv_users | map(attribute='name') | list }}"
  loop_control:
    label: "{{ item }}"

- name: Validate per-user route CIDR notation
  assert:
    that:
      - item.route is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
        or item.route is match('^([0-9a-fA-F:]+)/[0-9]{1,3}$')
    fail_msg: >-
      Route {{ item.route }} for user {{ item.username }} must be a CIDR prefix (e.g. 192.168.50.0/24).
  loop: "{{ _ocserv_route_checks }}"
  loop_control:
    label: "{{ item.username }}: {{ item.route }}"
  vars:
    _ocserv_route_checks: >-
      {%- set out = [] -%}
      {%- for row in ocserv_users | subelements('routes', skip_missing=True) -%}
      {%- set _ = out.append({'username': row.0.name, 'route': row.1}) -%}
      {%- endfor -%}
      {{ out }}

# Include build tasks if build is needed
- include_tasks: build.yaml
  when: ocserv_build_needed

- name: Discover ocserv binary path
  shell: command -v ocserv || true
  register: ocserv_path_cmd
  changed_when: false

- name: Set ocserv binary path fact
  set_fact:
    ocserv_bin_path: "{{ ocserv_path_cmd.stdout | default('/usr/local/sbin/ocserv') | trim }}"

- name: Create ocserv systemd service file
  template:
    src: ocserv.service.j2
    dest: /etc/systemd/system/ocserv.service
    mode: '0644'
  notify:
    - reload systemd
    - restart ocserv

- name: Flush handlers to reload systemd immediately
  meta: flush_handlers

- name: Create ocserv configuration dir
  file:
    path: "{{ ocserv_config.config_file | dirname }}"
    state: directory
    mode: '0755'

- name: Copy CA certificate file
  copy:
    src: "{{ ocserv_ca_cert_file }}"
    dest: "{{ ocserv_config.ca_cert }}"
    owner: root
    group: root
    mode: '0600'
  notify: restart ocserv
  when: ocserv_ca_cert_file | default('', true) | length > 0

- name: Configure ocserv
  template:
    src: ocserv.conf.j2
    dest: "{{ ocserv_config.config_file }}"
    mode: '0644'
  notify: restart ocserv

- name: Configure users list
  become: true
  command:
    cmd: ocpasswd -c {{ ocserv_passwd_file }} {{ user.name }}
    stdin: "{{ user.password }}"
  loop: "{{ _ocserv_user_passwords }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"
  vars:
    _ocserv_user_passwords: >-
      {%- set out = [] -%}
      {%- for u in ocserv_users -%}
      {%- if u.password is defined -%}
      {%- set _ = out.append({'name': u.name, 'password': u.password}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true
  notify: restart ocserv

- name: Ensure per-user config directory exists
  file:
    path: "{{ ocserv_per_user_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Apply per-user config
  template:
    src: per-user-config.static-ip.j2
    dest: "{{ ocserv_per_user_config_dir }}/{{ user.name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _ocserv_user_static_ips }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"
  vars:
    _ocserv_user_static_ips: >-
      {%- set out = [] -%}
      {%- for u in ocserv_users -%}
      {%- if u.ipv4_address is defined -%}
      {%- set _ = out.append({'name': u.name, 'ipv4_address': u.ipv4_address}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  notify: restart ocserv

- name: Ensure per-user routes directory exists
  file:
    path: "{{ ocserv_user_routes_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  when: ocserv_has_user_routes

- name: Deploy connect/disconnect hook script
  template:
    src: ocserv-user-routes-hook.sh.j2
    dest: "{{ ocserv_connect_script }}"
    owner: root
    group: root
    mode: '0755'
  when: ocserv_has_user_routes
  notify: restart ocserv

- name: Apply per-user routes file
  template:
    src: user-routes.j2
    dest: "{{ ocserv_user_routes_dir }}/{{ user.name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _ocserv_user_routes }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"
  vars:
    _ocserv_user_routes: >-
      {%- set out = [] -%}
      {%- for u in ocserv_users -%}
      {%- if u.routes is defined and u.routes | length > 0 -%}
      {%- set _ = out.append({'name': u.name, 'routes': u.routes}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  notify: restart ocserv

- name: Remove per-user routes file when unset
  file:
    path: "{{ ocserv_user_routes_dir }}/{{ username }}"
    state: absent
  loop: "{{ _ocserv_users_without_routes }}"
  loop_control:
    label: "{{ username }}"
  vars:
    username: "{{ item }}"
    _ocserv_users_without_routes: >-
      {%- set out = [] -%}
      {%- for u in ocserv_users -%}
      {%- if u.routes is not defined or u.routes | length == 0 -%}
      {%- set _ = out.append(u.name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Ensure kernel ip forwarding is enabled
  sysctl:
    name: net.ipv4.ip_forward
    value: 1
    state: present

- name: Add ocserv forward rules to UFW before.rules
  blockinfile:
    path: /etc/ufw/before.rules
    marker: "# {mark} ANSIBLE MANAGED OCSERV VPN FORWARD"
    block: |
      # ocserv: {{ ocserv_config.device }}+ <-> {{ external_interface_ipv4 }}
      -A ufw-before-forward -i {{ ocserv_config.device }}+ -o {{ external_interface_ipv4 }} -j ACCEPT
      -A ufw-before-forward -i {{ external_interface_ipv4 }} -o {{ ocserv_config.device }}+ -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      # ocserv: {{ ocserv_config.device }}+ <-> {{ ocserv_config.device }}+
      -A ufw-before-forward -i {{ ocserv_config.device }}+ -o {{ ocserv_config.device }}+ -j ACCEPT
    insertbefore: "^# don't delete the 'COMMIT' line"
  notify: reload ufw

- name: Enable ocserv service
  systemd:
    name: ocserv
    enabled: yes
  notify: restart ocserv
